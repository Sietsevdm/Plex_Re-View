<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Plex Re-View</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="85%">
      <stop offset="0" stop-color="#22123d"/>
      <stop offset=".65" stop-color="#05060d"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset=".15" stop-color="#22e3ff"/>
      <stop offset=".85" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#e5a00d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <!-- replay ring: clockwise from upper right round to upper left, arrowhead closes the loop -->
    <path d="M352.4 141.1A150 150 0 1 1 159.6 141.1" fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="round"/>
    <path d="M196 110 132 112 184 172z" fill="#22e3ff" stroke="#22e3ff" stroke-width="10" stroke-linejoin="round"/>
    <!-- play button -->
    <path d="M222 186v140l116-70z" fill="url(#play)" stroke="url(#play)" stroke-width="26" stroke-linejoin="round"/>
  </g>
</svg>
